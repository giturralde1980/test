name: Playwright Tests

on:
  repository_dispatch:
    types: [jira-testplan-linked]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci
        shell: cmd

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        shell: cmd

      - name: Run tests
        run: npx playwright test
        shell: cmd
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          HEADLESS: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
          retention-days: 7

      - name: Summary
        if: always()
        shell: powershell
        run: |
          $xml = "reports/junit/results.xml"
          if (Test-Path $xml) {
            [xml]$j = Get-Content $xml
            $s = $j.testsuites
            $total = $s.tests; $failed = $s.failures; $errors = $s.errors; $skipped = $s.skipped
            $passed = [int]$total - [int]$failed - [int]$errors - [int]$skipped
            $icon = if ([int]$failed -eq 0 -and [int]$errors -eq 0) { "✅" } else { "❌" }
            $summary = @"
          ## $icon Playwright Test Results
          | Total | Passed | Failed | Errors | Skipped |
          |-------|--------|--------|--------|---------|
          | $total | $passed | $failed | $errors | $skipped |
          "@
            $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            "## ⚠️ No se encontró el reporte JUnit" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
