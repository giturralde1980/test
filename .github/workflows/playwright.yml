name: Playwright Tests

on:
  repository_dispatch:
    types: [run-tests, jira-testplan-linked]
  workflow_dispatch:
    inputs:
      region:
        description: 'Región a ejecutar'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - andalucia
          - madrid

jobs:
  test-andalucia:
    name: 'Andalucía'
    # Corre siempre salvo que se pida explícitamente solo Madrid
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.region != 'madrid') ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.region != 'madrid')
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci
        shell: cmd

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        shell: cmd

      - name: Run Andalucía tests
        run: npm run test:andalucia
        shell: cmd
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          HEADLESS: true
          TESTRAIL_URL: ${{ secrets.TESTRAIL_URL }}
          TESTRAIL_USER: ${{ secrets.TESTRAIL_USER }}
          TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
          TESTRAIL_PROJECT_ID: ${{ secrets.TESTRAIL_PROJECT_ID }}
          TESTRAIL_ENABLED: ${{ secrets.TESTRAIL_ENABLED }}

      - name: Upload Andalucía report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-andalucia
          path: reports/
          retention-days: 7

  test-madrid:
    name: 'Madrid'
    # Corre siempre salvo que se pida explícitamente solo Andalucía
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.region != 'andalucia') ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.region != 'andalucia')
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci
        shell: cmd

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        shell: cmd

      - name: Run Madrid tests
        run: npm run test:madrid
        shell: cmd
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          MADRID_USERNAME: ${{ secrets.MADRID_USERNAME }}
          MADRID_PASSWORD: ${{ secrets.MADRID_PASSWORD }}
          HEADLESS: true
          TESTRAIL_URL: ${{ secrets.TESTRAIL_URL }}
          TESTRAIL_USER: ${{ secrets.TESTRAIL_USER }}
          TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
          TESTRAIL_PROJECT_ID: ${{ secrets.TESTRAIL_PROJECT_ID }}
          TESTRAIL_ENABLED: ${{ secrets.TESTRAIL_ENABLED }}

      - name: Upload Madrid report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-madrid
          path: reports/
          retention-days: 7
