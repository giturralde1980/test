name: Playwright Tests

on:
  repository_dispatch:
    types: [jira-testplan-linked]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci
        shell: cmd

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        shell: cmd

      - name: Run tests
        run: npx playwright test
        shell: cmd
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          HEADLESS: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
          retention-days: 7

      - name: Summary
        if: always()
        shell: powershell
        run: |
          Write-Host "Working dir: $(Get-Location)"
          $xml = Join-Path (Get-Location) "reports/junit/results.xml"
          Write-Host "Looking for: $xml"
          if (Test-Path $xml) {
            [xml]$j = Get-Content $xml
            $s = $j.testsuites
            $total  = [int]$s.tests
            $failed = [int]$s.failures
            $errors = [int]$s.errors
            $skipped = [int]$s.skipped
            $passed = $total - $failed - $errors - $skipped
            $icon = if ($failed -eq 0 -and $errors -eq 0) { "✅" } else { "❌" }
            $content = "## $icon Playwright Test Results`n"
            $content += "| Total | Passed | Failed | Errors | Skipped |`n"
            $content += "|-------|--------|--------|--------|---------|`n"
            $content += "| $total | $passed | $failed | $errors | $skipped |`n"
            $utf8 = New-Object System.Text.UTF8Encoding $false
            [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $content, $utf8)
          } else {
            $utf8 = New-Object System.Text.UTF8Encoding $false
            [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "## No se encontro el reporte JUnit en: $xml`n", $utf8)
          }
